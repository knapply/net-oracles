rem_inertia_decay:
  params: {fn: rem_statistic, stat: inertia, memory: decay, param: 5}
  applies_to: any
  tolerance: {rel: 1.0e-9, abs: 1.0e-9}
  oracles:
    definition:
      call: "recount from the whole history at every event (rem_definition_oracle.py)"
    remstats:
      call: c * remstats::remstats(reh, tie_effects = ~ inertia(), memory = "decay", memory_value = 5), c = (ln 2 / 5) 2^(-1/5)
      undefined_on: [pair]
      undefined_reason: remify rejects a stream this short (one edge).
      note: >-
        remstats weights a past event by exp(-(t' - t_e) ln 2 / T), where t' is
        the time of the previous event, and omits the factor ln 2 / T of
        Brandes et al. (2009); the definition evaluates the weight at the
        current event's time t = t' + 1. Event times are consecutive integers,
        so the two differ by the constant c = (ln 2 / T) 2^(-1/T), and the
        golden values are remstats' scaled by c (sum of squares by c^2;
        fitted coefficients divided by c). The closure statistics take the
        smaller of two counts, which scales the same way.

