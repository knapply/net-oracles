      partial: true
      tolerance: {rel: 1.0e-3, abs: 1.0e-4}
      note: >-
        Coefficients only (remstimate's standard errors are written as NaN):
        remstimate stops its optimizer at a looser tolerance than the
        engine's Newton iteration, so coefficients agree to at most 3e-4
        absolute or 0.4% relative (largest seen; the definition oracle and the
        engine agree to 1e-11).
      undefined_on: [cycle7_dir, davis_twomode, florentine, pair, path10, southern_women, star8, twomode_random, twomode_weighted]
      undefined_reason: >-
        On pair, remify rejects a stream this short. On the others the maximum
        partial likelihood estimate does not exist (the likelihood is monotone;
        the engine and the definition oracle report it as -999) and remstimate
        returns its last iterate.
      differs_on: [complete5_dir]
      reason: >-
        remstimate's coefficients differ by up to a few percent on these
        fixtures, while the engine agrees with the definition oracle's Newton
        iteration to 1e-11 there (tolerance 1e-9); the difference is in remstimate's optimizer.

