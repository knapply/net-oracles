# Relational event models: the statistics of an event stream over the full
# risk set of every event, and the partial-likelihood fit of the ordinal
# model (Butts 2008; Perry and Wolfe 2013). Format: see ../README.md.
#
# Every fixture is read as a stream of directed events by
# derived/rem.py (self-loops dropped, each edge repeated one to
# three times, some occurrences reversed, a fixed pseudo-random order,
# time k + 1 for the k-th event). The engine runners are in
# bindings/rem.py; the oracle oracles/
# rem_definition_oracle.py recomputes every count from the whole history
# at every event (numpy arrays, no incremental state) and fits by its own
# Newton iteration on the dense design.
#
# rem_statistic results: one line per event in time order, holding the
# statistic of the event's own dyad, its sum over the full risk set (every
# ordered pair of distinct actors), and its sum of squares over the risk
# set; so every risk-set value enters the comparison without writing the
# whole design.
#
# rem_fit results: the coefficients, then their standard errors. When the
# maximum partial likelihood estimate does not exist (the likelihood is
# monotone, as on small fixtures where no event repeats a dyad) or there
# are no events, every value is written as -999; the engine reports this
# as non-convergence and the definition oracle by no convergence in 200
# iterations.
#
# Engine options:
#   fn          rem_statistic | rem_fit
#   stat        (rem_statistic) inertia | reciprocity | sender_out |
#               sender_in | receiver_out | receiver_in | transitive |
#               cyclic | shared_out | shared_in | recency_dyad |
#               recency_reciprocal | recency_sender_out | recency_sender_in
#               | recency_receiver_out | recency_receiver_in
#   stats       (rem_fit) list of statistics, in coefficient order
#   memory      full (default) | window | decay; param is the window width
#               (events with t_e >= t - width count) or the half-life
#               (weight exp(-(t - t_e) ln 2 / T) ln 2 / T)
#   triad       min (default) | product | binary: how closure statistics
#               combine the two counts of a two-path or shared partner
#   event_type  count only events of this type ((e + j) mod 2)
#   weighted    events carry the fixture's edge weights
#   ties        pairs of simultaneous events (shared history and risk set)
#
# remstats (`arena2026remstats`) and remstimate
# (`arena2026remstimate`) are run by oracles/r_rem.R. remstats
# leaves out the first event (empty history), which the script writes as
# zeros. Decayed statistics: remstats weights a past event by
# exp(-(t' - t_e) ln 2 / T) without the factor ln 2 / T of Brandes et al.
# (2009), and with an ordinal history it evaluates the decay at the time t'
# of the previous event rather than at the current event's time. For event
# times 1, 2, 3, ... that is a constant factor c = (ln 2 / T) 2^(-1/T) on
# every linear or minimum-of-counts statistic, so the oracle script scales
# remstats' values by c (see rem_inertia_decay); the product and binary
# decay variants have no such relation and no remstats oracle. Product
# closure, event types, weights, recency of the reciprocal dyad, and ties
# have no remstats counterpart.

rem_inertia:
  params: {fn: rem_statistic, stat: inertia}
  applies_to: any
  tolerance: {rel: 1.0e-9, abs: 1.0e-9}
  oracles:
    definition:
      call: "recount from the whole history at every event (rem_definition_oracle.py)"
    remstats:
      call: remstats::remstats(reh, tie_effects = ~ inertia(), memory = "full")
      undefined_on: [pair]
      undefined_reason: remify rejects a stream this short (one edge).

