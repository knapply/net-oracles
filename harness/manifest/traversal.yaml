# Traversals (breadth-first, depth-first, over edges, beam search) and the
# shortest-path searches whose results depend on how ties are settled
# (insertion-ordered Dijkstra, bidirectional searches, A*, the
# Bellman-Ford-Moore queue). Format: see ../README.md; engine runners and
# encodings in ../bindings/traversal.py.
#
# The engine reads the fixture's adjacency in NetworkX's order (nodes
# 0..n - 1, then edges in file order); NetworkX runs on its multigraph of the
# fixture with edge keys equal to positions. The definition oracle
# (traversal_definition_oracle.py) writes each search from its textbook
# definition over the same adjacency order. Weighted searches use the
# fixture's weights (the least over parallel edges) and unit lengths on
# unweighted fixtures.

trav_bfs_edges:
  params: {fn: trav_bfs_edges}
  applies_to: any
  tolerance: {rel: 1.0e-12, abs: 0}
  oracles:
    definition:
      call: "textbook search over NetworkX's adjacency order (traversal_definition_oracle.py)"
    networkx:
      call: "nx.bfs_edges(M, 0)"

trav_bfs_layers:
  params: {fn: trav_bfs_layers}
  applies_to: any
  tolerance: {rel: 1.0e-12, abs: 0}
  oracles:
    definition:
      call: "textbook search over NetworkX's adjacency order (traversal_definition_oracle.py)"
    networkx:
      call: "nx.bfs_layers(M, [0])"

trav_bfs_labeled:
  params: {fn: trav_bfs_labeled}
  applies_to: any
  tolerance: {rel: 1.0e-12, abs: 0}
  oracles:
    definition:
      call: "textbook search over NetworkX's adjacency order (traversal_definition_oracle.py)"
    networkx:
      call: "nx.bfs_labeled_edges(M, [0])"

trav_dfs_events:
