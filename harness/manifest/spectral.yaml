      undefined_on: [empty, single_node]
      undefined_reason: >-
        scikit-network rejects an adjacency matrix without entries ('The input matrix is empty').
    graphblas:
      call: "nx.pagerank(G simple, personalization = {v: v % 3 + 1}, tol = 1e-14, backend = 'graphblas')"
      differs_when: [multi_edges]
      differs_on: [empty, single_node]
      reason: >-
        graphblas-algorithms accepts only Graph and DiGraph, so parallel edges
        collapse into one (the last weight wins); the engine counts each edge.
        On a graph without edges graphblas-algorithms returns 0 for every node;
        the PageRank of an edgeless graph is uniform (every node dangles), as
        the engine and NetworkX return.

