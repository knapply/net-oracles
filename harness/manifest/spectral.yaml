# PageRank, Katz centrality, Bonacich power centrality, hubs and
# authorities, assortativity, mixing matrices, the E-I index, and
# within-group tie shares. Format: see ../README.md.
#
# Undefined values (NaN) are written as empty lines, so they match only
# undefined values. Fixtures have no node attributes, so attributes come
# from deterministic rules named in the engine spec (bindings/
# spectral.py, `node_rule`): mod3 = v mod 3, id = v, mod3plus1 =
# (v mod 3) + 1, num7 = 7v mod 11, num3 = 3v mod 5, for 0-based node v.
# The R oracles name nodes "n1", "n2", ... and attach these rules as node
# attributes.
#
# Engine options beyond the common keys:
#   alpha_fraction, exponent_fraction: the parameter is this fraction of
#       1 / lambda_max for the adjacency matrix the measure uses; each
#       oracle computes lambda_max itself.
#   simple: true  run on the adjacency-matrix reading of the network
#       (parallel edges collapsed, self-loops dropped), as sna reads it.
#   which: hubs | authorities  which vector of the hub and authority scores.
#
# The homophily oracle is the R package homophily (Knapp 2019), run by
# oracles/r_spectral.R when it is installed.

pagerank:
  params: {fn: pagerank, damping: 0.85, loops: twice}
  applies_to: any
  tolerance: {rel: 1.0e-9, abs: 1.0e-11}
  oracles:
    gephi:
      call: "Gephi toolkit 0.11.3: PageRank (setProbability(0.85), setEpsilon(1e-14), setUseEdgeWeight(false)), node column 'pageranks' (oracles/system/gephi/Oracle.java)"
      differs_on: [multi_loops_dir, multi_loops_und]
      reason: "Gephi defect: with self-loops its PageRank scores do not sum to 1 (0.545 and 0.496 on these fixtures); see the small reproduction in docs/drafts/correctness_findings.md. Without loops it matches."
    definition:
      call: "solution of x = d P^T x + (d s + 1 - d) p by dense linear algebra (spectral_definition_oracle.py)"
    igraph:
      call: "igraph::page_rank(g, damping = 0.85, weights = NA)$vector"
    pyigraph:
      call: "python-igraph: g.pagerank(damping=0.85, weights=None)"
    networkit:
      call: "nk.centrality.PageRank(G, damp = 0.85, tol = 1e-15, distributeSinks = SinkHandling.DISTRIBUTE_SINKS)"
      differs_when: [loops, multi_edges, isolates, disconnected, edge_case]
      reason: >-
        NetworKit 11 reads self-loops, parallel edges and nodes without out-
        links differently (docs/drafts/convention_atlas.md), so on graphs with
        any of them, and on graphs too small for its conventions, its scores
        differ.
      undefined_on: [empty, gnp_und_sparse, multi_loops_und, single_node, two_triangles_isolate]
      undefined_reason: >-
        NetworKit 11 returns a different value or none on these inputs (loops
        and parallel edges, directed input, isolated nodes, fewer than three
        nodes, or a disconnected graph for the standard closeness), so no
        value is compared; see docs/drafts/convention_atlas.md. (the oracle
        script skips these fixtures; on other graphs the tag declarations
        apply)
    rustworkx:
      tolerance: {rel: 5.0e-8, abs: 5.0e-11}  # rx.pagerank stops on its own L1 test: on the 97k-node ukwiki fixture its top scores sit 6e-9 (relative) from the engine and NetworkX, which agree to 1e-9; twice the spread of the sized tier, 3.5e-12 on the small corpus
      call: "rx.pagerank(G as arcs, alpha = 0.85, tol = 1e-14, max_iter = 100000)"
      differs_when: [loops]
      reason: >-
        rx.pagerank() takes a directed graph; an undirected fixture enters as
        two arcs per edge and one arc per self-loop, so a loop counts once
        (NetworkX's convention, pagerank_networkx), not twice (igraph's, this
        variant).
    sknetwork:
      call: "sknetwork.ranking.PageRank(damping_factor = 0.85, solver = 'piteration', n_iter = 100000, tol = 1e-15).fit_predict(A)"
      differs_on: [gnp_dir_sparse, gnp_und_sparse, multi_loops_und, pair, two_triangles_isolate, weighted_dir]
      reason: >-
        scikit-network's random-surfer operator weights the restart vector by
        each node's own out-degree status, b_i = (1 - d [i has out-links]) y_i
        (sknetwork/linalg/ppr_solver.py), instead of spreading the rank of
        dangling nodes over y, so on fixtures with dangling nodes (sinks or
        isolates) its scores are not the stationary distribution of the Google
        matrix the engine and NetworkX use. Elsewhere the two agree.
      undefined_on: [empty, single_node]
      undefined_reason: >-
        scikit-network rejects an adjacency matrix without entries ('The input matrix is empty').
    graphblas:
      call: "nx.pagerank(G simple, alpha = 0.85, tol = 1e-14, max_iter = 100000, backend = 'graphblas')"
      differs_when: [multi_edges]
      differs_on: [empty, single_node]
      reason: >-
        graphblas-algorithms accepts only Graph and DiGraph, so parallel edges
        collapse into one (the last weight wins); the engine counts each edge.
        On a graph without edges graphblas-algorithms returns 0 for every node;
        the PageRank of an edgeless graph is uniform (every node dangles), as
        the engine and NetworkX return.

pagerank_networkx:
  params: {fn: pagerank, damping: 0.85, loops: once}
  applies_to: any
  tolerance: {rel: 1.0e-9, abs: 1.0e-11}
  oracles:
    definition:
      call: "as pagerank, with an undirected self-loop counted once"
    networkx:
      differs_on: [mid_messy_dir_int_2000, mid_plc_dir_4000]
      reason: >-
        The tool stops when the L1 change of the iterate falls below n * tol, which leaves an
        error of a few 1e-9 relative on networks of thousands of nodes. Against the exact
        solution of the linear system (numpy.linalg.solve) on mid_messy_dir_int_2000 NetworkX is
        off by 3.4e-11 absolute (4.2e-9 relative), the engine by 1.8e-12 (2.1e-10).
      call: "nx.pagerank(MultiGraph/MultiDiGraph, alpha = 0.85, weight = None, tol = 1e-14)"
    networkit:
      call: "nk.centrality.PageRank(G, damp = 0.85, tol = 1e-15, distributeSinks = SinkHandling.DISTRIBUTE_SINKS)"
      undefined_on: [empty, gnp_und_sparse, multi_loops_und, single_node, two_triangles_isolate]
      undefined_reason: >-
        NetworKit 11 returns a different value or none on these inputs (loops
        and parallel edges, directed input, isolated nodes, fewer than three
        nodes, or a disconnected graph for the standard closeness), so no
        value is compared; see docs/drafts/convention_atlas.md.
    rustworkx:
      tolerance: {rel: 5.0e-8, abs: 5.0e-11}  # rx.pagerank stops on its own L1 test: on the 97k-node ukwiki fixture its top scores sit 6e-9 (relative) from the engine and NetworkX, which agree to 1e-9; twice the spread of the sized tier, 3.5e-12 on the small corpus
      differs_on: [mid_messy_dir_int_2000, mid_plc_dir_4000]
      reason: >-
        The tool stops when the L1 change of the iterate falls below n * tol, which leaves an
        error of a few 1e-9 relative on networks of thousands of nodes. Against the exact
        solution of the linear system (numpy.linalg.solve) on mid_messy_dir_int_2000 NetworkX is
        off by 3.4e-11 absolute (4.2e-9 relative), the engine by 1.8e-12 (2.1e-10).
      call: "rx.pagerank(G as arcs, alpha = 0.85, tol = 1e-14, max_iter = 100000)"
    sknetwork:
      call: "sknetwork.ranking.PageRank(damping_factor = 0.85, solver = 'piteration', n_iter = 100000, tol = 1e-15).fit_predict(A)"
      differs_on: [gnp_dir_sparse, gnp_und_sparse, multi_loops_und, pair, two_triangles_isolate, weighted_dir]
      reason: >-
        scikit-network's random-surfer operator weights the restart vector by
        each node's own out-degree status, b_i = (1 - d [i has out-links]) y_i
        (sknetwork/linalg/ppr_solver.py), instead of spreading the rank of
        dangling nodes over y, so on fixtures with dangling nodes (sinks or
        isolates) its scores are not the stationary distribution of the Google
        matrix the engine and NetworkX use. Elsewhere the two agree.
      undefined_on: [empty, single_node]
      undefined_reason: >-
        scikit-network rejects an adjacency matrix without entries ('The input matrix is empty').
    graphblas:
      call: "nx.pagerank(G simple, alpha = 0.85, tol = 1e-14, max_iter = 100000, backend = 'graphblas')"
      differs_when: [multi_edges]
      differs_on: [empty, single_node]
      reason: >-
        graphblas-algorithms accepts only Graph and DiGraph, so parallel edges
        collapse into one (the last weight wins); the engine counts each edge.
        On a graph without edges graphblas-algorithms returns 0 for every node;
        the PageRank of an edgeless graph is uniform (every node dangles), as
        the engine and NetworkX return.
    jgrapht:
      call: 'JGraphT 1.5.2: new PageRank<>(g, 0.85, 10000, 1e-14) on a pseudograph (oracles/system/jgrapht/Oracle.java)'

pagerank_weighted:
  params: {fn: pagerank, damping: 0.85, weighted: true, loops: twice}
  applies_to: any
  requires_weights: true
  tolerance: {rel: 1.0e-9, abs: 1.0e-11}
  oracles:
    gephi:
      call: "Gephi toolkit 0.11.3: PageRank (setProbability(0.85), setEpsilon(1e-14), setUseEdgeWeight(true)), node column 'pageranks' (oracles/system/gephi/Oracle.java)"
    definition:
      call: "as pagerank, transition probabilities proportional to weights"
      undefined_when: [negative_weights]
      undefined_reason: >-
        Negative weights are outside the measure's domain (lengths, transition
        probabilities, attenuated walks): the engine declines (no value) where
        the oracle computes numbers from them.
    igraph:
      call: "igraph::page_rank(g, damping = 0.85, weights = E(g)$weight)$vector"
      undefined_when: [negative_weights]
      undefined_reason: >-
        Negative weights are outside the measure's domain (lengths, transition
        probabilities, attenuated walks): the engine declines (no value) where
        the oracle computes numbers from them.
    networkx:
      differs_on: [mid_messy_dir_int_2000, mid_plc_dir_4000]
      reason: >-
        The tool stops when the L1 change of the iterate falls below n * tol, which leaves an
        error of a few 1e-9 relative on networks of thousands of nodes. Against the exact
        solution of the linear system (numpy.linalg.solve) on mid_messy_dir_int_2000 NetworkX is
        off by 3.4e-11 absolute (4.2e-9 relative), the engine by 1.8e-12 (2.1e-10).
      call: "nx.pagerank(G, weight = 'weight', tol = 1e-14)"
      undefined_when: [negative_weights]
      undefined_reason: >-
        Negative weights are outside the measure's domain (lengths, transition
        probabilities, attenuated walks): the engine declines (no value) where
        the oracle computes numbers from them.
    pyigraph:
      call: "python-igraph: g.pagerank(damping=0.85, weights=w)"
      undefined_when: [negative_weights]
      undefined_reason: >-
        Negative weights are outside the measure's domain (lengths, transition
        probabilities, attenuated walks): the engine declines (no value) where
        the oracle computes numbers from them.
    networkit:
      call: "nk.centrality.PageRank(G_weighted, damp = 0.85, tol = 1e-15, distributeSinks = SinkHandling.DISTRIBUTE_SINKS)"
      undefined_when: [zero_weights, negative_weights]
      undefined_reason: >-
        NetworKit returns no value when an edge weight is zero or negative.
      differs_when: [loops]
      reason: >-
        The entry counts an undirected self-loop twice (loops: twice);
        NetworKit counts it once.
    rustworkx:
      tolerance: {rel: 5.0e-8, abs: 5.0e-11}  # rx.pagerank stops on its own L1 test: on the 97k-node ukwiki fixture its top scores sit 6e-9 (relative) from the engine and NetworkX, which agree to 1e-9; twice the spread of the sized tier, 3.5e-12 on the small corpus
      call: "rx.pagerank(G as arcs, alpha = 0.85, weight_fn = float, tol = 1e-14, max_iter = 100000)"
      differs_when: [loops]
      reason: >-
        The entry counts an undirected self-loop twice (loops: twice);
        rustworkx counts it once.
      undefined_when: [negative_weights]
      undefined_reason: >-
        Negative weights are outside the measure's domain (lengths, transition
        probabilities, attenuated walks): the engine declines (no value) where
        the oracle computes numbers from them.
    sknetwork:
      call: "sknetwork.ranking.PageRank(damping_factor = 0.85, solver = 'piteration', n_iter = 100000, tol = 1e-15).fit_predict(W)"
      differs_on: [gnp_dir_sparse, gnp_und_sparse, multi_loops_und, pair, two_triangles_isolate, weighted_dir]
      reason: >-
        scikit-network's random-surfer operator weights the restart vector by
        each node's own out-degree status, b_i = (1 - d [i has out-links]) y_i
        (sknetwork/linalg/ppr_solver.py), instead of spreading the rank of
        dangling nodes over y, so on fixtures with dangling nodes (sinks or
        isolates) its scores are not the stationary distribution of the Google
        matrix the engine and NetworkX use. Elsewhere the two agree.
    graphblas:
      call: "nx.pagerank(G simple, weight = 'weight', tol = 1e-14, backend = 'graphblas')"
      differs_when: [multi_edges]
      differs_on: [empty, single_node]
      reason: >-
        graphblas-algorithms accepts only Graph and DiGraph, so parallel edges
        collapse into one (the last weight wins); the engine counts each edge.
        On a graph without edges graphblas-algorithms returns 0 for every node;
        the PageRank of an edgeless graph is uniform (every node dangles), as
        the engine and NetworkX return.
    jgrapht:
      call: 'JGraphT 1.5.2: new PageRank<>(g_weighted, 0.85, 10000, 1e-14) on a pseudograph (oracles/system/jgrapht/Oracle.java)'

pagerank_personalized:
  params: {fn: pagerank, damping: 0.85, personalization: mod3plus1, loops: twice}
  applies_to: any
  tolerance: {rel: 1.0e-9, abs: 1.0e-11}
  oracles:
    definition:
      call: "as pagerank, jumps and dangling nodes following p proportional to (v mod 3) + 1"
    igraph:
      call: "igraph::page_rank(g, personalized = (0:(n - 1)) %% 3 + 1, weights = NA)$vector"
    pyigraph:
      call: "python-igraph: g.personalized_pagerank( damping=0.85, weights=None, reset=node_rule(\"mod3plus1\", n))"
    rustworkx:
      tolerance: {rel: 5.0e-8, abs: 5.0e-11}  # rx.pagerank stops on its own L1 test: on the 97k-node ukwiki fixture its top scores sit 6e-9 (relative) from the engine and NetworkX, which agree to 1e-9; twice the spread of the sized tier, 3.5e-12 on the small corpus
      call: "rx.pagerank(G as arcs, alpha = 0.85, personalization = {v: v % 3 + 1}, tol = 1e-14)"
      differs_when: [loops]
      reason: >-
        A self-loop enters rx.pagerank() as one arc, so it counts once, not
        twice as in this variant (see pagerank).
    sknetwork:
      call: "sknetwork.ranking.PageRank(...).fit_predict(A, weights = (v % 3 + 1) / sum)"
      differs_on: [gnp_dir_sparse, gnp_und_sparse, multi_loops_und, pair, two_triangles_isolate, weighted_dir]
      reason: >-
        scikit-network's random-surfer operator weights the restart vector by
