    jgrapht:
      call: "JGraphT 1.5.2: CSVImporter(CSVFormat.MATRIX) with MATRIX_FORMAT_NODEID and MATRIX_FORMAT_ZERO_WHEN_NO_EDGE (oracles/system/io_formats_jgrapht/IoOracle.java)"
      only_on: [pair]
      undefined_reason: "the cases are file texts and do not use the fixture graph; one fixture carries them"

io_tsplib:
  params: {fn: io_tsplib}
  applies_to: any
