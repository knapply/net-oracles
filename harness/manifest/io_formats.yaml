    jgrapht:
      call: "JGraphT 1.5.2: CSVImporter(CSVFormat.ADJACENCY_LIST) (oracles/system/io_formats_jgrapht/IoOracle.java)"
      only_on: [pair]
      undefined_reason: "the cases are file texts and do not use the fixture graph; one fixture carries them"

io_csv_matrix:
  params: {fn: io_csv, cases: matrix}
  applies_to: any
