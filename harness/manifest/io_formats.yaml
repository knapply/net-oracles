    jgrapht:
      call: "JGraphT 1.5.2: CSVImporter(CSVFormat.EDGE_LIST) with EDGE_WEIGHTS for the weighted cases (oracles/system/io_formats_jgrapht/IoOracle.java)"
      only_on: [pair]
