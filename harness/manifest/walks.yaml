# Personalized PageRank (random walk with restart): the local push of
# Andersen, Chung, and Lang (2006) and the exact power iteration, against
# NetworkX's pagerank with a personalization vector. Format: see
# ../README.md; runners and encodings in ../bindings/walks.py. The restart
# distribution has weight 2 on node 0 and 1 on node n - 1. NetworkX counts
# an undirected self-loop once, the engine twice (the adjacency matrix).
#
# Oracles: `networkx` is walks_networkx_oracle.py.

walks_ppr_push:
  params: {fn: walks_ppr, method: push, alpha: 0.15, eps: 1.0e-13}
  applies_to: any
  tolerance: {rel: 5.0e-10, abs: 5.0e-13}
  oracles:
    networkx:
      call: "nx.pagerank(G, alpha = 0.85, personalization = {0: 2, n - 1: 1}, tol = 1e-14, max_iter = 100000, weight = None)"
      undefined_when: [loops]
      undefined_reason: NetworkX counts an undirected self-loop once, the engine twice.

walks_ppr_push_weighted:
  params: {fn: walks_ppr, method: push, alpha: 0.3, eps: 1.0e-13, weighted: true}
  applies_to: any
  requires_weights: true
  tolerance: {rel: 2.0e-9, abs: 5.0e-12}
  oracles:
    networkx:
      call: "nx.pagerank(G, alpha = 0.7, personalization = {0: 2, n - 1: 1}, tol = 1e-14, max_iter = 100000, weight = 'weight')"
      undefined_when: [loops]
      undefined_reason: NetworkX counts an undirected self-loop once, the engine twice.

walks_ppr_exact:
  params: {fn: walks_ppr, method: exact, alpha: 0.15}
  applies_to: any
  tolerance: {rel: 1.0e-10, abs: 2.0e-13}
  oracles:
    networkx:
      call: "nx.pagerank(G, alpha = 0.85, personalization = {0: 2, n - 1: 1}, tol = 1e-14, max_iter = 100000, weight = None)"
      undefined_when: [loops]
      undefined_reason: NetworkX counts an undirected self-loop once, the engine twice.
