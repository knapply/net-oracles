ergm_terms_valued_only:
  params:
    fn: oracle_only
    pages: [atleast, atmost, cdf, cyclicalweights, equalto, greaterthan, ininterval, nodecovar, nodeicovar, nodeocovar, smallerthan, sum, transitiveweights, B]
  applies_to: any
  tolerance: {rel: 1.0e-12, abs: 1.0e-9}
  oracles:
    ergm:
      call: "none: the term cannot run on the fixtures"
      undefined_when: [directed, undirected]
      undefined_reason: >-
        These ergm pages are valued-only (or, for B, wrap binary terms for valued
        models): they need edge values and a valued network with a response,
        and every fixture here is a binary simple graph (weighted fixtures keep
        their weights outside the ergm network object).

ergm_terms_operators:
  params:
    fn: oracle_only
    pages: [Curve, Exp, F, For, I, Log, NodematchFilter, Offset, Prod, Project, S, Sum]
  applies_to: any
  tolerance: {rel: 1.0e-12, abs: 1.0e-9}
  oracles:
    ergm:
      call: "none: the term cannot run on the fixtures"
      undefined_when: [directed, undirected]
      undefined_reason: >-
        Operators take inner terms, a second formula, a derived network or
        a sequence of arguments (Curve, Exp, F, For, I, Log, NodematchFilter,
        Offset, Prod, Project, S, Sum); no default argument set runs on the
        fixtures without inventing a model. Label and Symmetrize, which do run
        with an inner term, are in the catalog entries.

ergm_terms_tergm_undefined:
  params:
    fn: oracle_only
    pages: [Change, Cross, Diss, EdgeAges, Form, Persist, degrange.mean.age, degree.mean.age, edge.ages, edgecov.ages, edgecov.mean.age, edges.ageinterval, mean.age, nodefactor.mean.age, nodemix.mean.age]
  applies_to: any
  tolerance: {rel: 1.0e-12, abs: 1.0e-9}
  oracles:
    ergm:
      call: "none: the term cannot run on the fixtures"
      undefined_when: [directed, undirected]
      undefined_reason: >-
        tergm pages: the operators (Change, Cross, Diss, EdgeAges, Form, Persist)
        need a lagged or changing network, and the edge-age terms (degrange.mean.age,
        degree.mean.age, edge.ages, edgecov.ages, edgecov.mean.age, edges.ageinterval,
        mean.age, nodefactor.mean.age, nodemix.mean.age) need edge timestamps; the
        fixtures are static, so tergm has no static term beyond the ergm ones.
