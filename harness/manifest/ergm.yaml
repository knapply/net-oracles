    the sums are the pooled change statistics MPLE regresses on.
  oracles:
    ergm:
      call: >-
        mple <- ergmMPLE(nw ~ <term>, output = "matrix");
        colSums(mple$predictor * mple$weights), for each term of the list (bipartite)
      only_on: [davis_twomode, twomode_random, twomode_weighted]
