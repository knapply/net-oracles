# Spanning trees (Kruskal 1956; Prim 1957; Boruvka 1926), optimum
# branchings and arborescences (Edmonds 1967; Tarjan 1977), and directed
# acyclic graphs: topological orders (Kahn 1962; Knuth and Szwarcfiter
# 1974), transitive closure and reduction, longest paths, dominators
# (Cooper, Harvey, and Kennedy 2001), and lowest common ancestors. Format:
# see ../README.md; engine runners, derived networks, and encodings in
# ../bindings/trees.py.
#
# DAG functions run on the DAG derived from each fixture (its arcs a -> b
# with a < b, in file order); tree lowest common ancestors on the
# breadth-first tree from node 0. Orders that depend on the neighbour
# order use the input order, which reproduces NetworkX for graphs built
# from the same edges in the same order.

tree_mst_weight:
  params: {fn: spanning_weight}
  applies_to: undirected
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "Jarnik-Prim on the dense matrix of lightest edges (trees_definition_oracle.py)"
    networkx:
      call: "nx.minimum_spanning_tree(M).size(weight = 'weight') on the multigraph"
    networkit:
      call: "nk.graph.KruskalMSF(G with unit weights).getTotalWeight()"
    rustworkx:
      call: "rx.minimum_spanning_edges(G, weight_fn = 1)"
    jgrapht:
      call: 'JGraphT 1.5.2: new KruskalMinimumSpanningTree<>(g).getSpanningTree().getWeight()
        on a pseudograph (oracles/system/jgrapht/Oracle.java)'
    boost:
      call: 'Boost Graph Library kruskal_minimum_spanning_tree (unit weights: tree edge count)
        (oracles/system/boost/oracle.cpp)'

tree_mst_weight_weighted:
  params: {fn: spanning_weight, weighted: true}
  applies_to: undirected
  requires_weights: true
  tolerance: {rel: 1.0e-12, abs: 1.0e-12}
  oracles:
    definition:
      call: "Jarnik-Prim on the dense matrix of lightest edges"
    networkx:
      call: "nx.minimum_spanning_tree(M, weight = 'weight').size(weight = 'weight')"
    networkit:
      call: "nk.graph.KruskalMSF(G_weighted).getTotalWeight()"
    rustworkx:
      call: "rx.minimum_spanning_edges(G, weight_fn = float)"
    jgrapht:
      call: 'JGraphT 1.5.2: new KruskalMinimumSpanningTree<>(g_weighted).getSpanningTree().getWeight()
        on a pseudograph (oracles/system/jgrapht/Oracle.java)'
    boost:
      call: Boost Graph Library kruskal_minimum_spanning_tree (oracles/system/boost/oracle.cpp)

tree_maxst_weight_weighted:
  params: {fn: spanning_weight, weighted: true, maximum: true}
  applies_to: undirected
  requires_weights: true
  tolerance: {rel: 1.0e-12, abs: 1.0e-12}
  oracles:
    definition:
      call: "Jarnik-Prim on the dense matrix of heaviest edges"
    networkx:
      call: "nx.maximum_spanning_tree(M, weight = 'weight').size(weight = 'weight')"

tree_mst_edges_kruskal:
  params: {fn: spanning_tree, weighted: true, nx_order: true}
  applies_to: undirected
  compare: sets
  tolerance: {rel: 0, abs: 0}
  oracles:
    networkx:
      call: "nx.minimum_spanning_edges(M, algorithm = 'kruskal', keys = True) as (u, v, weight); the engine is given the edges in M.edges() order"

tree_mst_edges_prim:
  params: {fn: spanning_tree, weighted: true, nx_order: true, algorithm: prim}
  applies_to: undirected
  compare: sets
  tolerance: {rel: 0, abs: 0}
  oracles:
    networkx:
      call: "nx.minimum_spanning_edges(M, algorithm = 'kruskal', keys = True): every algorithm of the engine returns Kruskal's forest"

tree_mst_edges_boruvka:
  params: {fn: spanning_tree, weighted: true, nx_order: true, algorithm: boruvka}
  applies_to: undirected
  compare: sets
  tolerance: {rel: 0, abs: 0}
  oracles:
    networkx:
      call: "nx.minimum_spanning_edges(M, algorithm = 'kruskal', keys = True)"

tree_maxst_edges_kruskal:
  params: {fn: spanning_tree, weighted: true, nx_order: true, maximum: true}
  applies_to: undirected
  compare: sets
  tolerance: {rel: 0, abs: 0}
  oracles:
    networkx:
      call: "nx.maximum_spanning_edges(M, algorithm = 'kruskal', keys = True) as (u, v, weight)"

tree_max_branching:
  params: {fn: branching, kind: max_branching, weighted: true}
  applies_to: directed
  tolerance: {rel: 1.0e-12, abs: 1.0e-12}
  oracles:
    definition:
      call: "best choice of at most one incoming arc per node without a cycle, over every choice"
      undefined_on: &bigdir [gnp_dir_dense, gnp_dir_sparse, multi_loops_dir, real_weights_dir,
                             weighted_dir]
      undefined_reason: >-
        trying every choice of incoming arcs is limited to networks with at
        most 300 000 choices
    networkx:
      call: "nx.maximum_branching(M, attr = 'weight').size(weight = 'weight')"

tree_min_branching:
  params: {fn: branching, kind: min_branching, weighted: true}
  applies_to: directed
  tolerance: {rel: 1.0e-12, abs: 1.0e-12}
  oracles:
    definition:
      call: "least-weight choice of at most one incoming arc per node without a cycle"
      undefined_on: *bigdir
      undefined_reason: as for tree_max_branching
    networkx:
      call: "nx.minimum_branching(M, attr = 'weight').size(weight = 'weight')"

tree_minimal_branching:
  params: {fn: branching, kind: minimal, weighted: true}
  applies_to: directed
  tolerance: {rel: 1.0e-12, abs: 1.0e-12}
  oracles:
    definition:
      call: "best choice under the weights (2 max - min + 1) - w, reported in the original weights"
      undefined_on: *bigdir
      undefined_reason: as for tree_max_branching
    networkx:
      call: "nx.algorithms.tree.branchings.minimal_branching(M, attr = 'weight').size(weight = 'weight')"

tree_max_arborescence:
  params: {fn: branching, kind: max_arborescence, weighted: true}
  applies_to: directed
  tolerance: {rel: 1.0e-12, abs: 1.0e-12}
  oracles:
    definition:
      call: "best choice of one incoming arc for all nodes but one root, without a cycle; -1 if none"
      undefined_on: *bigdir
      undefined_reason: as for tree_max_branching
    networkx:
      call: "nx.maximum_spanning_arborescence(M, attr = 'weight').size(weight = 'weight'); -1 on NetworkXException"

tree_min_arborescence:
  params: {fn: branching, kind: min_arborescence, weighted: true}
  applies_to: directed
  tolerance: {rel: 1.0e-12, abs: 1.0e-12}
  oracles:
    definition:
      call: "least-weight choice of one incoming arc for all nodes but one root, without a cycle; -1 if none"
      undefined_on: *bigdir
      undefined_reason: as for tree_max_branching
    networkx:
      call: "nx.minimum_spanning_arborescence(M, attr = 'weight').size(weight = 'weight'); -1 on NetworkXException"

dag_topological_sort:
  params: {fn: topological_sort, order: input}
  applies_to: any
  tolerance: {rel: 0, abs: 0}
  oracles:
    networkx:
      call: "list(nx.topological_sort(D))"

dag_generations:
  params: {fn: generations}
  applies_to: any
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "number of arcs on the longest path ending at each node"
    networkx:
      call: "generation index of each node in nx.topological_generations(D)"

dag_lexicographic:
  params: {fn: lexicographic}
  applies_to: any
  tolerance: {rel: 0, abs: 0}
  oracles:
    networkx:
      call: "list(nx.lexicographical_topological_sort(D))"

dag_all_topological:
  params: {fn: all_topological, order: input}
  applies_to: any
  tolerance: {rel: 0, abs: 0}
  oracles:
    networkx:
      call: "the first 50 orders of nx.all_topological_sorts(D), in its sequence"

dag_is_dag:
  params: {fn: is_dag}
  applies_to: any
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "1 for a directed network in which no node reaches itself"
    networkx:
      call: "nx.is_directed_acyclic_graph(M)"
    rustworkx:
      call: "rx.is_directed_acyclic_graph(G)"
      undefined_when: [undirected]
      undefined_reason: >-
        rx.is_directed_acyclic_graph() accepts only a PyDiGraph.

dag_closure_cycles:
  params: {fn: closure, reflexive: cycles}
  applies_to: directed
  compare: sets
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "pairs (u, v) with v reachable from u by at least one arc"
    networkx:
      call: "nx.transitive_closure(G, reflexive = False).edges()"

dag_closure_never:
  params: {fn: closure, reflexive: never}
  applies_to: directed
  compare: sets
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "pairs (u, v), v != u reachable from u, and existing self-loops"
    networkx:
      call: "nx.transitive_closure(G, reflexive = None).edges()"

dag_closure_always:
  params: {fn: closure, reflexive: always}
  applies_to: directed
  compare: sets
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "pairs (u, v) with v reachable from u, and every (v, v)"
    networkx:
      call: "nx.transitive_closure(G, reflexive = True).edges()"

dag_reduction:
  params: {fn: reduction}
  applies_to: any
  compare: sets
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "arcs u -> v of D such that v is not reachable from another successor of u"
    networkx:
      call: "nx.transitive_reduction(D).edges()"

dag_longest_path:
  params: {fn: longest_path}
  applies_to: any
  tolerance: {rel: 0, abs: 0}
  oracles:
    networkx:
      call: "nx.dag_longest_path(D)"

dag_longest_path_weighted:
  params: {fn: longest_path, weighted: true}
  applies_to: any
  requires_weights: true
  tolerance: {rel: 0, abs: 0}
  oracles:
    networkx:
      call: "nx.dag_longest_path(D, weight = 'weight') on the multigraph D"

dag_longest_length:
  params: {fn: longest_length}
  applies_to: any
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "the most arcs on any path, by enumerating every path (n <= 20)"
      undefined_on: &bigpaths [davis_twomode, gnp_dir_dense, gnp_dir_sparse, gnp_und_dense,
                               gnp_und_sparse, karate, les_miserables, real_weights_dir,
                               real_weights_und, southern_women, twomode_random,
                               uniform_weights, weighted_dir, weighted_und]
      undefined_reason: enumerating every path is limited to fixtures of at most 20 nodes
    networkx:
      call: "nx.dag_longest_path_length(D)"

dag_longest_length_weighted:
  params: {fn: longest_length, weighted: true}
  applies_to: any
  requires_weights: true
  tolerance: {rel: 1.0e-12, abs: 1.0e-12}
  oracles:
    definition:
      call: "the greatest weight of any path, by enumerating every path (n <= 20)"
      undefined_on: *bigpaths
      undefined_reason: as for dag_longest_length
    networkx:
      call: "nx.dag_longest_path_length(D, weight = 'weight') on the multigraph D"

dag_immediate_dominators:
  params: {fn: idom}
  applies_to: directed
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "the strict dominator of v dominated by all others; d dominates v when v is unreachable from 0 without d"
    networkx:
      call: "nx.immediate_dominators(G, 0), with 0 for the start and -1 for unreachable nodes"

dag_dominance_frontiers:
  params: {fn: frontiers}
  applies_to: directed
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "nodes y with a predecessor dominated by x, not strictly dominated by x (Cytron et al. 1991)"
      undefined_when: [null_graph]
      undefined_reason: >-
        The null graph has no start node 0; the engine rejects the start.
    networkx:
      call: "nx.dominance_frontiers(G, 0), one sorted tuple per node, (-1) if unreachable"

dag_lca:
  params: {fn: dag_lca, order: input}
  applies_to: any
  tolerance: {rel: 0, abs: 0}
  oracles:
    networkx:
      call: "dict(nx.all_pairs_lowest_common_ancestor(D, pairs)) for every pair u <= v, -1 if absent"
      reason: >-
        When a pair has several lowest common ancestors NetworkX starts its
        walk from the first common ancestor in Python's set order and the
        engine from the one of smallest index, so they can return different,
        equally valid ancestors (checked pair by pair on the corpus: every
        differing answer of both is a lowest common ancestor). dag_lca_check
        confirms every engine answer.
      differs_when: [directed, undirected]

dag_lca_check:
  params: {fn: dag_lca_check}
  applies_to: any
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "[pairs u <= v with a common ancestor, 1]; the runner checks that each answer is a common ancestor with no child that is one"
    networkx:
      call: "[number of pairs nx.all_pairs_lowest_common_ancestor(D, pairs) answers, 1]"

dag_tree_lca:
  params: {fn: tree_lca}
  applies_to: any
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "last common node of the root paths of u and v in the breadth-first tree"
    networkx:
      call: "nx.tree_all_pairs_lowest_common_ancestor(T, root = 0, pairs)"
