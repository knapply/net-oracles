  oracles:
    definition:
      call: "lonlat with height, surface distance sqrt(great_circle^2 + dz^2): size, centroid, mean and root mean square distance per group (node %% 3), evaluated from the definition in exact or 60-digit decimal arithmetic"
    scipy:
