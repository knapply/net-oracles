# Geospatial functions with a third coordinate and Cartesian spaces of one
# or more dimensions: edge lengths, proximity networks (within a distance,
# k nearest neighbours) and group geometry. Format: see ../README.md.
#
# The fixtures carry no coordinates, so the oracles and the engine runner
# derive them from the fixture size by the rule in
# oracles/spatial_points.py (repeated in bindings/spatial.py):
#   crs: lonlat | planar | cartesian
#   dim: number of coordinate columns (lonlat 2 or 3, the third a height in
#        radius units; planar 2 or 3; cartesian 1 or more)
#   height: surface (default; sqrt(great_circle^2 + dz^2)) | chord
#           (straight line between the points on the sphere of radius R + h)
#   metric: euclidean | manhattan | chebyshev | minkowski (cartesian only), p
#   r / k: within a distance (<=) / the k nearest other points
#   partition: mod3
# Ties, for every oracle: a pair at distance exactly r is within; neighbours
# at equal distance rank by node index. Edge lists have one line per edge:
# from, to, distance; group geometry one line per group: size, centroid
# (one value per column), mean distance, root mean square distance.
#
# Oracle names: `definition` is spatial_definition_oracle.py (exact or
# 60-digit decimal arithmetic), `scipy` spatial_scipy_oracle.py (scipy.spatial
# distance functions and cKDTree as black boxes; the tie rules applied to
# its output).

spatial_edge_lengths_ll3_surface:
  params: {fn: spatial_edge_lengths, crs: lonlat, dim: 3, height: surface}
  applies_to: any
  tolerance: {rel: 1.0e-12, abs: 1.0e-7}
  oracles:
    definition:
      call: "lonlat with height, surface distance sqrt(great_circle^2 + dz^2): length of every edge between its endpoints, evaluated from the definition in exact or 60-digit decimal arithmetic"
    scipy:
      call: "lonlat with height, surface distance sqrt(great_circle^2 + dz^2): length of every edge between its endpoints; scipy.spatial (cKDTree.query_pairs, cKDTree.query with k = n re-ranked by (distance, index), scipy.spatial.distance functions for lengths and dispersion)"

spatial_within_ll3_surface:
  params: {fn: spatial_proximity, crs: lonlat, dim: 3, height: surface, r: 3000000.0}
  applies_to: any
  tolerance: {rel: 1.0e-12, abs: 1.0e-7}
  oracles:
    definition:
      call: "lonlat with height, surface distance sqrt(great_circle^2 + dz^2): every pair (i < j) within r, one line per pair, evaluated from the definition in exact or 60-digit decimal arithmetic"
    scipy:
      call: "lonlat with height, surface distance sqrt(great_circle^2 + dz^2): every pair (i < j) within r, one line per pair; scipy.spatial (cKDTree.query_pairs, cKDTree.query with k = n re-ranked by (distance, index), scipy.spatial.distance functions for lengths and dispersion)"

spatial_knn_ll3_surface:
  params: {fn: spatial_proximity, crs: lonlat, dim: 3, height: surface, k: 3}
  applies_to: any
  tolerance: {rel: 1.0e-12, abs: 1.0e-7}
  oracles:
    definition:
      call: "lonlat with height, surface distance sqrt(great_circle^2 + dz^2): the 3 nearest other points of each point, ties by index, evaluated from the definition in exact or 60-digit decimal arithmetic"
    scipy:
      call: "lonlat with height, surface distance sqrt(great_circle^2 + dz^2): the 3 nearest other points of each point, ties by index; scipy.spatial (cKDTree.query_pairs, cKDTree.query with k = n re-ranked by (distance, index), scipy.spatial.distance functions for lengths and dispersion)"

