# Named graphs, graph complement and products, degree-sequence realization
# and Pruefer coding (crates/engine/src/named_graphs.rs, graph_ops.rs,
# realize.rs and generate_models.rs, C interface crates/capi/src/gen_extra.rs):
# each family on a table of cases (derived/generators_ext.py) against the
# defining rule and NetworkX. Runners and encodings: ../bindings/generators_ext.py;
# oracles generators_ext_definition_oracle.py and generators_ext_networkx_oracle.py.
#
# The cases do not use the fixture graph, so every entry runs on the fixture
# `pair` only. A case result is a row (node count, edge count) followed by the
# sorted edges: an undirected edge as (smaller, larger), an arc as (source,
# target). Graphicality entries give one row (1 or 0) per case; Pruefer coding
# gives the sequence length then one row per label.
#
# Node numbering is NetworkX's integer numbering. The hexagonal and
# triangular lattices label nodes by (column, row) pairs in NetworkX; here
# the integer is the rank of the pair among the surviving pairs in
# lexicographic order. A product node (u, x) is u * |H| + x. NetworkX has no
# Havel-Hakimi tie rule that matches the documented one (its `havel_hakimi_graph`
# labels nodes by their rank among the positive degrees), so the realizations
# are checked against the documented rule and for exact degrees and
# simplicity, and graphicality against NetworkX and exhaustive search.
# NetworkX's complement never has loops (`op_complement_loops` is definition
# only). The random models of these families are checked in
# ../generators_check.py.
#
# gen_invalid lists parameters outside the domain; the engine must refuse
# each with a message that says why (1 = refused with the expected words).

gen_barbell:
  params: {fn: cat_barbell, family: barbell}
  applies_to: any
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "two cliques, the path between them, and the two joining edges"
      only_on: [pair]
      undefined_reason: "the cases are fixed and do not use the fixture graph; one fixture carries them"
    networkx:
      call: "nx.barbell_graph(m1, m2)"
      only_on: [pair]
      undefined_reason: "the cases are fixed and do not use the fixture graph; one fixture carries them"
