# Degree, strength, betweenness, and the triad census: the first measures,
# validated against every oracle. The manifest format is documented in
# ../README.md; this file is the reference example of it.
#
# Oracle names: `definition` is core_definition_oracle.py, `networkx`
# core_networkx_oracle.py, and `igraph` and `sna` r_core.R.

degree_all:
  params: {fn: degree, mode: all, loops: true}
  applies_to: any
  tolerance: {rel: 0, abs: 0}
  oracles:
    gephi:
      call: "Gephi toolkit 0.11.3: Degree.execute(graphModel), node column 'degree' (oracles/system/gephi/Oracle.java)"
    definition:
      call: "direct evaluation of the definition (core_definition_oracle.py)"
    networkx:
      call: "MultiGraph/MultiDiGraph G.degree()"
    igraph:
      call: "igraph::degree(g, mode = 'all', loops = TRUE)"
    sna:
      call: "sna::degree(m, gmode, cmode = 'freeman' | 'indegree' for graphs)"
      differs_when: [loops, multi_edges]
      reason: >-
        sna works on adjacency matrices, so parallel edges collapse to one,
        and it ignores the diagonal by default (diag = FALSE).
    pyigraph:
      call: "python-igraph: g.degree(mode=\"all\", loops=True)"
    networkit:
      call: "G.degree(v) (undirected) or G.degreeIn(v) + G.degreeOut(v), fixture edges added one by one"
      undefined_on: [multi_loops_und]
      undefined_reason: >-
        NetworKit 11 returns a different value or none on these inputs (loops
        and parallel edges, directed input, isolated nodes, fewer than three
        nodes, or a disconnected graph for the standard closeness), so no
        value is compared; see docs/drafts/convention_atlas.md.
    published:
      call: 'degree column of the table (kite: Krackhardt 1990; karate: Zachary 1977; Florentine:
        Padgett and Ansell 1993)'
      only_on: [kite, karate, florentine]
      partial: true
      tolerance: {rel: 0, abs: 0}
      undefined_reason: the literature tables cover only the classic networks

degree_all_noloops:
  params: {fn: degree, mode: all, loops: false}
  applies_to: any
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "direct evaluation of the definition (core_definition_oracle.py)"
    igraph:
      call: "igraph::degree(g, mode = 'all', loops = FALSE)"
    sna:
      call: "sna::degree(m, gmode, diag = FALSE)"
      differs_when: [multi_edges]
      reason: sna works on adjacency matrices, so parallel edges collapse to one.
    pyigraph:
      call: "python-igraph: g.degree(mode=\"all\", loops=False)"
    networkit:
      call: "G.removeSelfLoops(); G.degree(v) or G.degreeIn(v) + G.degreeOut(v)"
      undefined_on: [multi_loops_und]
      undefined_reason: >-
        NetworKit 11 returns a different value or none on these inputs (loops
        and parallel edges, directed input, isolated nodes, fewer than three
        nodes, or a disconnected graph for the standard closeness), so no
        value is compared; see docs/drafts/convention_atlas.md.
    bct:
      call: 'Brain Connectivity Toolbox 2019-03-03 in Octave: degrees_und / degrees_dir (in +
        out), on the binary adjacency matrix without loops or parallel edges (oracles/system/bct/oracle.m)'
      differs_on:
      - multi_loops_dir
      - multi_loops_und
      reason: 'A bct call takes a binary adjacency matrix, which cannot carry loops or parallel
        edges: the driver keeps one arc per ordered pair and drops loops, while the engine counts
        every edge.'

degree_out:
  params: {fn: degree, mode: out, loops: true}
  applies_to: directed
  tolerance: {rel: 0, abs: 0}
  oracles:
    gephi:
      call: "Gephi toolkit 0.11.3: Degree.execute(graphModel), node column 'outdegree' (oracles/system/gephi/Oracle.java)"
    definition:
      call: "direct evaluation of the definition (core_definition_oracle.py)"
    networkx:
      call: "MultiDiGraph G.out_degree()"
    igraph:
      call: "igraph::degree(g, mode = 'out', loops = TRUE)"
    sna:
      call: "sna::degree(m, cmode = 'outdegree')"
      differs_when: [loops, multi_edges]
      reason: sna collapses parallel edges and ignores the diagonal by default.
    pyigraph:
      call: "python-igraph: g.degree(mode=\"out\", loops=True)"
    networkit:
      call: "G.degreeOut(v)"
    bct:
      call: 'Brain Connectivity Toolbox 2019-03-03 in Octave: degrees_dir, on the binary adjacency
        matrix without loops or parallel edges (oracles/system/bct/oracle.m)'
      differs_on:
      - multi_loops_dir
      reason: 'A bct call takes a binary adjacency matrix, which cannot carry loops or parallel
        edges: the driver keeps one arc per ordered pair and drops loops, while the engine counts
        every edge.'

degree_in:
  params: {fn: degree, mode: in, loops: true}
  applies_to: directed
  tolerance: {rel: 0, abs: 0}
  oracles:
    gephi:
      call: "Gephi toolkit 0.11.3: Degree.execute(graphModel), node column 'indegree' (oracles/system/gephi/Oracle.java)"
    definition:
      call: "direct evaluation of the definition (core_definition_oracle.py)"
    networkx:
      call: "MultiDiGraph G.in_degree()"
    igraph:
      call: "igraph::degree(g, mode = 'in', loops = TRUE)"
    sna:
      call: "sna::degree(m, cmode = 'indegree')"
      differs_when: [loops, multi_edges]
      reason: sna collapses parallel edges and ignores the diagonal by default.
    pyigraph:
      call: "python-igraph: g.degree(mode=\"in\", loops=True)"
    networkit:
      call: "G.degreeIn(v)"
    bct:
      call: 'Brain Connectivity Toolbox 2019-03-03 in Octave: degrees_dir, on the binary adjacency
        matrix without loops or parallel edges (oracles/system/bct/oracle.m)'
      differs_on:
      - multi_loops_dir
      reason: 'A bct call takes a binary adjacency matrix, which cannot carry loops or parallel
        edges: the driver keeps one arc per ordered pair and drops loops, while the engine counts
        every edge.'

strength_all:
  params: {fn: strength, mode: all, loops: true}
  applies_to: any
  requires_weights: true
  tolerance: {rel: 1.0e-12, abs: 1.0e-12}
  oracles:
    gephi:
      call: "Gephi toolkit 0.11.3: WeightedDegree.execute(graphModel), node column 'weighted degree' (oracles/system/gephi/Oracle.java)"
    networkx:
      call: "G.degree(weight = 'weight')"
    igraph:
      call: "igraph::strength(g, mode = 'all', loops = TRUE)"
    pyigraph:
      call: "python-igraph: g.strength(mode=\"all\", loops=True, weights=w)"
    tnet:
      call: "tnet::degree_w(net, measure = 'output') (out + in when directed), loops dropped, parallel edges summed"
      differs_when: [loops, isolates, zero_weights]
      reason: >-
        tnet drops self-loops from the strength (two nodes, one edge and a
        loop at a node, all of weight 1: tnet 1, where the engine counts an
        undirected loop at both ends, 3), and reports NaN for a node without
        ties (the engine 0), which includes a node whose only ties have
        weight 0 (tnet drops zero-weight ties, so the node has none left).
    networkit:
      call: "G.weightedDegree(v, countSelfLoopsTwice = True)"
      undefined_on: [real_weights_dir, weighted_dir]
      undefined_reason: >-
        NetworKit 11 returns a different value or none on these inputs (loops
        and parallel edges, directed input, isolated nodes, fewer than three
        nodes, or a disconnected graph for the standard closeness), so no
        value is compared; see docs/drafts/convention_atlas.md.

betweenness:
  params: {fn: betweenness, weighted: false, normalized: false}
  applies_to: any
  tolerance: {rel: 1.0e-9, abs: 1.0e-9}
  oracles:
    gephi:
      call: "Gephi toolkit 0.11.3: GraphDistance (setNormalized(false); setDirected as the network), node column 'betweenesscentrality' (oracles/system/gephi/Oracle.java)"
    definition:
      call: "direct evaluation of the definition (core_definition_oracle.py)"
    networkx:
      call: "nx.betweenness_centrality(G, normalized = False)"
      differs_when: [multi_edges]
      reason: >-
        NetworkX traverses neighbor sets, so parallel edges count as a single
        shortest path. igraph and this engine count each parallel edge as a
        distinct path.
    igraph:
      call: "igraph::betweenness(g, weights = NA, normalized = FALSE)"
    sna:
      call: "sna::betweenness(m, gmode, cmode = 'directed' | 'undirected')"
      differs_when: [multi_edges]
      reason: sna works on adjacency matrices, so parallel edges collapse to one.
    pyigraph:
      call: "python-igraph: gu.betweenness(directed=d)"
    netrankr:
      call: "aggregate_positions(indirect_relations(g, 'depend_sp'), 'sum')"
      undefined_when: [directed]
      undefined_on: [single_node]
      undefined_reason: >-
        netrankr reads the network as undirected, unweighted and simple (the
        oracle writes nothing for a directed fixture) and has no value for a
        single node.
      differs_when: [multi_edges, loops]
      reason: >-
        netrankr reads the simple undirected graph (parallel edges collapsed,
        loops dropped), while the engine counts parallel edges as distinct
        shortest paths. The oracle halves netrankr's sum over ordered pairs.
    networkit:
      call: "nk.centrality.Betweenness(G, normalized = False)"
      undefined_on: [multi_loops_dir, multi_loops_und]
      undefined_reason: >-
        NetworKit 11 returns a different value or none on these inputs (loops
        and parallel edges, directed input, isolated nodes, fewer than three
        nodes, or a disconnected graph for the standard closeness), so no
        value is compared; see docs/drafts/convention_atlas.md.
    rustworkx:
      call: "rx.betweenness_centrality(G, normalized = False) on a multigraph"
    bctpy:
      call: "bct.betweenness_bin(A binary, no diagonal)"
      differs_when: [multi_edges]
      reason: >-
        BCT works on a connection matrix, so parallel edges collapse to one tie
        (one shortest path per pair of neighbours); the engine counts each
        edge.
    jgrapht:
      call: 'JGraphT 1.5.2: new BetweennessCentrality<>(g, false) on a pseudograph (oracles/system/jgrapht/Oracle.java)'
    boost:
      call: Boost Graph Library brandes_betweenness_centrality(g) (oracles/system/boost/oracle.cpp)
    bct:
      call: 'Brain Connectivity Toolbox 2019-03-03 in Octave: betweenness_bin, on the binary adjacency
        matrix without loops or parallel edges (oracles/system/bct/oracle.m)'
      differs_on:
      - multi_loops_dir
      differs_when:
      - undirected
      reason: 'BCT''s betweenness_bin counts ordered pairs, so an undirected network''s value
        is exactly twice the engine''s (checked on every undirected network with a nonzero value);
        a BCT call takes a binary adjacency matrix, which cannot carry loops or parallel edges:
        the driver keeps one arc per ordered pair and drops loops, while the engine counts every
        edge (multi_loops_dir).'

betweenness_normalized:
  params: {fn: betweenness, weighted: false, normalized: true}
  applies_to: any
  tolerance: {rel: 1.0e-9, abs: 1.0e-12}
  oracles:
    gephi:
      call: "Gephi toolkit 0.11.3: GraphDistance (setNormalized(true)), node column 'betweenesscentrality' (oracles/system/gephi/Oracle.java)"
      differs_when: [edge_case]
      reason: "With fewer than three nodes the normalizing constant is zero. Gephi returns NaN (0/0); this engine, like NetworkX, returns 0, since no node can lie between two others."
    definition:
      call: "direct evaluation of the definition (core_definition_oracle.py)"
    networkx:
      call: "nx.betweenness_centrality(G, normalized = True)"
      differs_when: [multi_edges]
      reason: NetworkX counts parallel edges as a single shortest path.
    igraph:
      call: "igraph::betweenness(g, weights = NA, normalized = TRUE)"
      differs_when: [edge_case]
      reason: >-
        With fewer than three nodes the normalizing constant (n-1)(n-2) is
        zero. igraph returns NaN; this engine, like NetworkX, returns 0,
        since no node can lie between two others.
    networkit:
      call: "nk.centrality.Betweenness(G, normalized = True)"
      undefined_on: [multi_loops_dir, multi_loops_und, pair, single_node]
      undefined_reason: >-
        NetworKit 11 returns a different value or none on these inputs (loops
        and parallel edges, directed input, isolated nodes, fewer than three
        nodes, or a disconnected graph for the standard closeness), so no
        value is compared; see docs/drafts/convention_atlas.md.
    rustworkx:
      call: "rx.betweenness_centrality(G, normalized = True) on a multigraph"
    published:
      call: normalized betweenness as printed (Krackhardt 1990 Table; Zachary karate as tabulated
        by Brandes 2001 and Newman 2010; Florentine as in Jackson 2008)
      only_on: [kite, karate, florentine]
      partial: true
      tolerance: {rel: 0, abs: 0.0006}
      note: >-
        Rounding of the published values: the tables print three decimals, so half a unit in the last place is 5e-4; largest difference seen 4.8e-4.
      undefined_reason: the literature tables cover only the classic networks
    jgrapht:
      call: 'JGraphT 1.5.2: new BetweennessCentrality<>(g, true) on a pseudograph (oracles/system/jgrapht/Oracle.java)'
      differs_when:
      - undirected
      reason: 'JGraphT normalizes the undirected betweenness by (n-1)(n-2) rather than (n-1)(n-2)/2:
        every nonzero value on all 16 undirected networks with at least three nodes is exactly
        half the engine''s (raw betweenness agrees).'
    boost:
      call: Boost Graph Library brandes_betweenness_centrality + relative_betweenness_centrality
        (oracles/system/boost/oracle.cpp)
      differs_on:
      - cycle7_dir
      - gnp_dir_dense
      - gnp_dir_sparse
      - multi_loops_dir
      - pair
      - real_weights_dir
      - single_node
      - weighted_dir
      reason: relative_betweenness_centrality gives exactly twice the engine's normalized value
        on every directed network (checked on all six directed networks with at least three nodes),
        and 0/0 = NaN where n < 3 (pair, single_node); undirected networks agree.

betweenness_weighted:
  params: {fn: betweenness, weighted: true, normalized: false}
  applies_to: any
  requires_weights: true
  tolerance: {rel: 1.0e-9, abs: 1.0e-9}
  oracles:
    definition:
      call: "direct evaluation of the definition (core_definition_oracle.py)"
    networkx:
      differs_when: [multi_edges]
      reason: >-
        NetworkX counts one shortest path per neighbour pair, so parallel edges of equal weight
        do not multiply the path count; the engine, igraph and NetworKit count each edge as a
        path (checked: 0->1 twice, 1->2, 0->3, 3->2, all weights 1, gives 2/3 and 1/3 for nodes
        1 and 3 in the engine, 1/2 and 1/2 in NetworkX).
      call: "nx.betweenness_centrality(G, weight = 'weight', normalized = False)"
    igraph:
      call: "igraph::betweenness(g, weights = E(g)$weight, normalized = FALSE)"
    pyigraph:
      call: "python-igraph: g.betweenness(directed=d, weights=w)"
    networkit:
      call: "nk.centrality.Betweenness(G_weighted, normalized = False)"
    bctpy:
      call: "bct.betweenness_wei(L), L = shortest parallel edge as length"
      differs_when: [multi_edges]
      reason: >-
        BCT works on a connection matrix, so parallel edges collapse to one tie
        (the shortest one); the engine counts each edge.
    jgrapht:
      call: 'JGraphT 1.5.2: new BetweennessCentrality<>(g_weighted, false) on a pseudograph (oracles/system/jgrapht/Oracle.java)'
    boost:
      call: Boost Graph Library brandes_betweenness_centrality(g, weight_map) (oracles/system/boost/oracle.cpp)
    bct:
      call: 'Brain Connectivity Toolbox 2019-03-03 in Octave: betweenness_wei (weights as lengths),
        on the binary adjacency matrix without loops or parallel edges (oracles/system/bct/oracle.m)'
      differs_when:
      - undirected
      reason: BCT's betweenness_wei counts ordered pairs, so an undirected network's value is
        exactly twice the engine's (all five weighted undirected networks with a nonzero value).

betweenness_weighted_strength:
  params: {fn: betweenness, weighted: true, normalized: false, weights_as: strength}
  applies_to: any
  requires_weights: true
  tolerance: {rel: 1.0e-9, abs: 1.0e-9}
  oracles:
    definition:
      call: "direct evaluation with exact lengths 1/w"
    networkx:
      call: "nx.betweenness_centrality(G, weight = 1/w, normalized = False)"
      differs_when: [integer_weights]
      reason: >-
        Reciprocals of whole-number weights often give path lengths that tie
        exactly (1/3 + 1/6 = 1/2) but differ in the last bit of floating
        point. NetworkX compares lengths exactly and drops one of the tied
        paths; this engine (like igraph) compares with a relative tolerance
        and agrees with the exact-arithmetic definition oracle.
    igraph:
      call: "igraph::betweenness(g, weights = 1 / E(g)$weight, normalized = FALSE)"
    pyigraph:
      call: "python-igraph: g.betweenness( directed=d, weights=[1 / x for x in g.es[\"weight\"]])"
    tnet:
      call: "tnet::betweenness_w(net, directed, alpha = 1)"
      differs_when: [isolates, multi_edges]
      reason: >-
        tnet reports NaN for a node without ties (its strength is 0 and the
        measure divides by it); the engine reports 0 betweenness. tnet also
        takes parallel edges as one tie of their summed weight (tnet rejects
        repeated pairs, so the oracle script sums them), which shortens its
        paths; the engine keeps the parallel edges apart, as the definition
        oracle, NetworkX and igraph do, and the four agree on the multigraph.

triad_census:
  params: {fn: triad_census}
  applies_to: any
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "direct evaluation of the definition (core_definition_oracle.py)"
    networkx:
      call: "nx.triadic_census(DiGraph(G))"
      undefined_when: [undirected]
      undefined_reason: >-
        NetworkX's triadic_census accepts only directed graphs.
      differs_when: [undirected]
      reason: NetworkX defines the triad census only for directed graphs.
    igraph:
      call: "igraph::triad_census(g)"
      differs_when: [multi_edges]
      reason: >-
        igraph's triad census does not support multigraphs: parallel edges
        change its counts. This engine, sna, and the definition oracle
        classify each dyad as tied or not, so parallel edges count once.
    sna:
      call: "sna::triad.census(m, mode = 'digraph')"
      undefined_when: [undirected]
      undefined_reason: >-
        sna's undirected triad census has four classes, not sixteen, so no
        golden values are written for undirected fixtures.
      differs_when: [undirected, edge_case]
      reason: >-
        sna returns NaN for networks with fewer than three nodes, which have
        no triads; this engine returns zero counts. For undirected graphs sna
        reports only the four undirected triad
        classes, while igraph and this engine report all 16 types with every
        edge treated as mutual.
    pyigraph:
      call: "python-igraph: list(g.triad_census()),"
      differs_when: [multi_edges]
      reason: >-
        igraph's triad census does not support multigraphs: parallel edges
        change its counts. This engine, sna, and the definition oracle
        classify each dyad as tied or not, so parallel edges count once.
    ergm:
      call: "summary(nw ~ triadcensus(0:15))"
      undefined_on: [complete6, davis_twomode, florentine, gnp_und_dense, gnp_und_sparse, karate, kite, les_miserables, multi_loops_und, pair, path10, real_weights_und, single_node, southern_women, star8, two_triangles_isolate, twomode_random, twomode_weighted, uniform_weights, weighted_und]
      undefined_reason: >-
        The census is computed for directed networks with at least three nodes
        only.
