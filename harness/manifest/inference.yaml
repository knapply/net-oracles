network_autocorrelation_moran_in:
  params: {fn: network_autocorrelation, kind: moran, neighborhood: in, lag_max: 3}
  applies_to: directed
  tolerance: {rel: 1.0e-12, abs: 1.0e-12}
  oracles:
    definition:
      call: "Moran's I of num7 over in-neighbourhoods, lags 0 to 3 (inference_definition_oracle.py)"
    sna:
      call: "sna::nacf(m, num7, lag.max = 3, type = 'moran', neighborhood.type = 'in', mode = 'digraph')"
      differs_on: [complete5_dir, empty, gnp_dir_dense, pair]
      reason: >-
        A lag with no pairs at that geodesic distance (lag 2 or 3 of a dense
        or small network) has no value: S0 = 0. The engine and the
