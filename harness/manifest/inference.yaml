      call: "network autocorrelation of num7 at lags 0 to 3, exact rationals (inference_definition_oracle.py)"
    sna:
      call: "sna::nacf(m, num7, lag.max = 3, type = 'correlation', neighborhood.type = 'out', mode = mode)"
      differs_on: [complete5_dir, complete6, empty, gnp_dir_dense, gnp_und_dense, pair, star8, two_triangles_isolate]
      reason: >-
        A lag with no pairs at that geodesic distance (lag 2 or 3 of a dense
        or small network) has no value: S0 = 0. The engine and the
        definition oracle give NaN, sna's nacf gives 0.
      undefined_when: [one_node]
      undefined_reason: >-
        The oracle script does not call sna on a network of one node.

network_autocorrelation_covariance:
  params: {fn: network_autocorrelation, kind: covariance, neighborhood: out, lag_max: 3}
  applies_to: any
  tolerance: {rel: 1.0e-12, abs: 1.0e-12}
  oracles:
    definition:
      call: "network autocovariance of num7 at lags 0 to 3, exact rationals (inference_definition_oracle.py)"
    sna:
      call: "sna::nacf(m, num7, lag.max = 3, type = 'covariance', neighborhood.type = 'out', mode = mode)"
      differs_on: [complete5_dir, complete6, empty, gnp_dir_dense, gnp_und_dense, pair, star8, two_triangles_isolate]
      reason: >-
