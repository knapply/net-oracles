network_autocorrelation_moran_exact:
  params: {fn: network_autocorrelation, kind: moran, neighborhood: out, lag_max: 3, exhaustive: true, part: p}
  applies_to: any
  tolerance: {rel: 0, abs: 1.0e-12}
  oracles:
    definition:
      call: "Pr(I <= observed), Pr(I >= observed) per lag over all n! relabelings of y (inference_definition_oracle.py)"
      only_on: [complete5_dir, complete6, cycle7_dir, empty, pair, single_node, star8, two_triangles_isolate]
      undefined_reason: exhaustive enumeration of n! relabelings, run on the fixtures of at most 8 nodes

network_autocorrelation_geary_exact:
  params: {fn: network_autocorrelation, kind: geary, neighborhood: out, lag_max: 3, exhaustive: true, part: p}
  applies_to: any
  tolerance: {rel: 0, abs: 1.0e-12}
  oracles:
    definition:
      call: "Pr(C <= observed), Pr(C >= observed) per lag over all n! relabelings of y (inference_definition_oracle.py)"
      only_on: [complete5_dir, complete6, cycle7_dir, empty, pair, single_node, star8, two_triangles_isolate]
      undefined_reason: exhaustive enumeration of n! relabelings, run on the fixtures of at most 8 nodes

# Network autocorrelation models by maximum likelihood (sna's lnam with one
# weight matrix; Ord 1975, Doreian 1980): y = num7, X = (1, num3) with
# num3 = (3 v) % 5, W the row-normalized simple adjacency (each row divided
# by its sum; a row without ties stays 0), or with `weighted: true` the
# row-normalized matrix of summed edge weights. Lag: y = rho W y + X beta +
# e; error: y = X beta + u, u = rho W u + e. Lines: the coefficients, then
# (rho, sigma, log-likelihood). rel 5e-4: sna maximizes the full likelihood
# with optim's BFGS, stopping on a relative change of 1e-10 in the
# likelihood, where the likelihood is flat in rho: the log-likelihoods
# agree to 1e-11 and rho and beta to about 3e-4 (uniform_weights); the engine and the
# definition oracle maximize the likelihood concentrated in rho over
# (-1 / r, 1 / r), r the largest absolute row sum of W, which bounds its
# spectral radius ((-1, 1) for a row-normalized W, the usual parameter
# space of the model; Anselin 1988). Where the likelihood still rises at an
# end of that interval the estimate is that end (to about 1e-12), while
# sna's unconstrained search goes beyond it. Undefined where the likelihood
# is flat in rho (no ties: empty)
# or the model fits exactly or is not identified (pair, single_node).

network_lag_model:
  params: {fn: network_autocorrelation_model, model: lag}
  applies_to: any
  tolerance: {rel: 5.0e-4, abs: 1.0e-6}
  oracles:
    definition:
      call: "maximum of the likelihood concentrated in rho over (-1 / r, 1 / r), dense log-determinants (inference_definition_oracle.py)"
      undefined_on: [empty, pair, single_node]
      undefined_reason: >-
        The likelihood is flat in rho without ties (empty), and the model
        fits exactly or is not identified on one or two nodes.
    sna:
      call: "sna::lnam(y, x = cbind(1, num3), W1 = W, control = list(maxit = 30))"
      differs_on: [gnp_dir_dense]
      reason: >-
        The likelihood still rises at rho = -1, the end of the parameter
        space of a row-normalized W; the engine stops there, sna's
        unconstrained BFGS goes beyond it.
      undefined_on: [complete5_dir, complete6, empty, pair, single_node]
      undefined_reason: >-
        The likelihood is flat in rho without ties (empty), and the model
        fits exactly or is not identified on one or two nodes; sna's lnam gives
        no fit on the complete graphs, where every row of a row-normalized W
        is the same up to the diagonal and rho is not identified.

network_error_model:
  params: {fn: network_autocorrelation_model, model: error}
  applies_to: any
  tolerance: {rel: 5.0e-4, abs: 1.0e-6}
  oracles:
    definition:
      call: "maximum of the likelihood concentrated in rho over (-1 / r, 1 / r), dense log-determinants (inference_definition_oracle.py)"
      undefined_on: [empty, pair, single_node]
      undefined_reason: >-
        The likelihood is flat in rho without ties (empty), and the model
        fits exactly or is not identified on one or two nodes.
    sna:
      call: "sna::lnam(y, x = cbind(1, num3), W2 = W, control = list(maxit = 30))"
      differs_on: [gnp_dir_dense, two_triangles_isolate]
      reason: >-
        The likelihood still rises at an end of the parameter space
        (-1, 1) of a row-normalized W; the engine stops there, sna's
        unconstrained BFGS goes beyond it.
      undefined_on: [complete5_dir, complete6, empty, pair, single_node]
      undefined_reason: >-
        The likelihood is flat in rho without ties (empty), and the model
        fits exactly or is not identified on one or two nodes; sna's lnam gives
        no fit on the complete graphs, where every row of a row-normalized W
        is the same up to the diagonal and rho is not identified.

network_lag_model_weighted:
  params: {fn: network_autocorrelation_model, model: lag, weighted: true}
  applies_to: any
  requires_weights: true
  tolerance: {rel: 5.0e-4, abs: 1.0e-6}
  oracles:
    definition:
      call: "maximum of the likelihood concentrated in rho over (-1 / r, 1 / r), W of summed weights (inference_definition_oracle.py)"
    sna:
      call: "sna::lnam(y, x = cbind(1, num3), W1 = W) with W the row-normalized summed weights"
